name: Apply Title Help Copy

on:
  push:
    paths:
      - '.github/workflows/apply-title-help-copy.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Update title help text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'app/src/main/java/com/yagay/ListCleaner/ui/MainTabs.kt',
              'Text("本页用于清理分享、多文件分享、打开方式、浏览器和文本处理等候选列表中的应用入口，不会停用或卸载应用。",',
              'Text("本页用于管理分享、多文件分享、打开方式、浏览器和文本处理等 Intent 候选入口：可按规则隐藏/保留组件，也可单独修改组件在系统候选菜单中的显示名称；不会修改实际 Intent、包名、组件名，也不会停用或卸载应用。",'
          )
          replace(
              'app/src/main/java/com/yagay/ListCleaner/ui/MainTabs.kt',
              'Text("勾选应用可批量选择当前分类及搜索条件下显示的组件；展开可逐项选择，也可修改组件在系统候选菜单中的显示名称。“查看”只筛选本页列表，不改变清理规则。",',
              'Text("勾选应用可批量选择当前分类及搜索条件下显示的组件；展开后可逐项选择，点铅笔可设置该组件在当前分类中的菜单显示名称。改名与是否勾选规则相互独立；留空保存恢复原名称。“查看”只筛选本页列表，不改变清理规则。",'
          )
          replace(
              'app/src/main/java/com/yagay/ListCleaner/ui/MainTabs.kt',
              'Text(if (state.runtime.ready) "system 已确认暂停过滤，勾选及排序保留" else "本地已选择暂停，尚未确认系统已应用",',
              'Text(if (state.runtime.ready) "system 已确认暂停过滤、排序和自定义显示名称；相关配置仍保留" else "本地已选择暂停，尚未确认系统已应用",'
          )

          replace(
              'app/src/main/java/com/yagay/ListCleaner/ui/PriorityDialog.kt',
              'Text("勾选后按优先位置排列，取消后回到未优先应用的默认名称顺序。",',
              'Text("勾选控制应用的优先顺序；自定义显示名称是独立功能，不需要把应用加入优先列表。",'
          )
          replace(
              'app/src/main/java/com/yagay/ListCleaner/ui/PriorityDialog.kt',
              'Text("长按已优先应用可拖动排序，松手保存；展开后也可上移、下移。展开组件后可修改其在系统候选菜单中的显示名称。",',
              'Text("长按已优先应用可拖动排序，松手保存；展开后也可上移、下移。展开组件后点铅笔可修改该组件在当前 Intent 分类中的菜单显示名称，留空保存恢复原名称。",'
          )
          replace(
              'app/src/main/java/com/yagay/ListCleaner/ui/PriorityDialog.kt',
              'Text("按分类保存。规则要求清理的组件不显示；应用仍有可见组件时保留。暂时隐藏的排序配置不删除，取消清理后恢复。分享适配推荐区及全部应用区，文本处理在查询出口排序；未知厂商菜单可能另行重排。联系人和调用方专属入口不调整。",',
              'Text("排序和显示名称都按 Intent 分类保存，同一组件在分享、打开方式等分类中可设置不同名称。改名只改变候选菜单展示文字，不修改应用名、Activity 名或实际跳转目标；“全部显示”模式下暂停应用自定义名称。规则要求清理的组件不显示；未知厂商自定义菜单若不读取标准 ResolveInfo 标签，改名可能不生效。",'
          )

          replace(
              'app/src/main/java/com/yagay/ListCleaner/ui/ComponentTitleDialog.kt',
              'Text("原名称：${item.activityLabel}", style = MaterialTheme.typography.bodyMedium)',
              'Text("原名称：${item.activityLabel}", style = MaterialTheme.typography.bodyMedium)\n                Text("仅修改该组件在 ${item.rule.kind.shortTitle} 候选菜单中的显示文字，不会修改应用名、Intent、包名、组件名或实际启动目标。", style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant)'
          )
          replace(
              'app/src/main/java/com/yagay/ListCleaner/ui/ComponentTitleDialog.kt',
              'supportingText = { Text("${text.length}/64 · 留空保存可恢复原名称") },',
              'supportingText = { Text("${text.length}/64 · 留空保存恢复原名称 · “全部显示”模式下暂不应用自定义名称") },'
          )
          PY
      - name: Verify help copy
        run: |
          grep -q '不会修改实际 Intent' app/src/main/java/com/yagay/ListCleaner/ui/MainTabs.kt
          grep -q '同一组件在分享、打开方式等分类中可设置不同名称' app/src/main/java/com/yagay/ListCleaner/ui/PriorityDialog.kt
          grep -q '不会修改应用名、Intent、包名、组件名或实际启动目标' app/src/main/java/com/yagay/ListCleaner/ui/ComponentTitleDialog.kt
      - name: Build and test
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/apply-title-help-copy.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clarify custom display name behavior'
          git push
