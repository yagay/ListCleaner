name: Apply App PM Query Filter

on:
  push:
    paths:
      - tools/apply_app_pm_query_filter.py
      - .github/workflows/apply-app-pm-query-filter.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply patch
        run: python3 tools/apply_app_pm_query_filter.py
      - name: Verify filter
        run: |
          grep -Fq 'APP_PM_QUERY_FILTER_APPLIED' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -Fq 'private enum class Layer { SYSTEM, RESOLVER, APP }' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -Fq 'ic-app-pm-query-filter' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-app-pm-query-filter-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Cleanup one-shot files
        run: |
          rm -f tools/apply_app_pm_query_filter.py
          rm -f .github/workflows/apply-app-pm-query-filter.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Filter custom chooser candidates in app process' || exit 0
          git push
