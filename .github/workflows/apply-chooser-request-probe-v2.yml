name: Apply Chooser Request Probe V2

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-chooser-request-probe-v2.py'
      - '.github/workflows/apply-chooser-request-probe-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Apply patch
        run: python3 tools/patch-chooser-request-probe-v2.py

      - name: Verify architecture
        run: |
          grep -q 'CHOOSER_REQUEST_SCHEMA' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -q 'CHOOSER_REQUEST_PROBE' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -q 'chooserRequestAccessorCache' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt

      - name: Build and test
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-chooser-request-probe-v2-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Remove one-shot patch files
        run: rm -f tools/patch-chooser-request-probe-v2.py .github/workflows/apply-chooser-request-probe-v2.yml

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Probe ActivityStarter request fields dynamically'
          git push
