name: Apply Menu Session Match Fix

on:
  push:
    paths:
      - tools/apply_menu_session_match_fix.py
      - .github/workflows/apply-menu-session-match-fix.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply patch
        run: python3 tools/apply_menu_session_match_fix.py
      - name: Verify
        run: |
          grep -Fq 'APP_MENU_MODEL_DECISION' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -Fq 'candidateIds = linkedSetOf' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-menu-session-match-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Cleanup one-shot files
        run: |
          rm -f tools/apply_menu_session_match_fix.py
          rm -f .github/workflows/apply-menu-session-match-fix.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix adapter menu session rule matching' || exit 0
          git push
