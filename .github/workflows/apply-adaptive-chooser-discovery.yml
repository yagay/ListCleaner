name: Apply Adaptive Chooser Discovery

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-adaptive-chooser-discovery.py'
      - '.github/workflows/apply-adaptive-chooser-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply discovery patch
        run: python3 tools/patch-adaptive-chooser-discovery.py
      - name: Verify architecture
        run: |
          grep -q 'CHOOSER_DISCOVERY_HOOK_INSTALLED' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -q 'CHOOSER_ACTIVITY_CANDIDATE' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -q 'CHOOSER_LEARNED' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
      - name: Build and test
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-adaptive-chooser-discovery-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
      - name: Remove one-shot patch files
        run: rm -f tools/patch-adaptive-chooser-discovery.py .github/workflows/apply-adaptive-chooser-discovery.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add adaptive chooser discovery engine'
          git push
