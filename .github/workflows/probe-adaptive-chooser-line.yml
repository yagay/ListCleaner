name: Probe Adaptive Chooser Compile Line

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-adaptive-chooser-line.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply generated patch
        run: |
          python3 tools/patch-adaptive-chooser-redirect.py
          python3 tools/fix-adaptive-chooser-redirect.py
          python3 tools/fix2-adaptive-chooser-redirect.py
      - name: Show failing area
        run: nl -ba app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt | sed -n '520,536p'
