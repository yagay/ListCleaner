name: Apply Hidden App List

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-hidden-app-list.py'
      - 'tools/fix-hidden-app-list.py'
      - '.github/workflows/apply-hidden-app-list.yml'

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply hidden app list migration
        run: |
          python3 tools/patch-hidden-app-list.py
          python3 tools/fix-hidden-app-list.py
      - name: Verify no app scope request remains in picker
        run: |
          ! grep -R "requestScope\|SCOPE_REQUEST_START\|加入 LSPosed Hook 列表" app/src/main/java/com/yagay/ListCleaner/ui/AppScopePicker.kt
          grep -q "hiddenFromApps" app/src/main/java/com/yagay/ListCleaner/domain/ModuleConfig.kt
          grep -q "fun setHiddenFromApps" app/src/main/java/com/yagay/ListCleaner/data/RuleRepository.kt
          grep -q "应用隐藏列表" app/src/main/java/com/yagay/ListCleaner/ui/MainTabs.kt
      - name: Build and test
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-hidden-app-list-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Remove one-shot patch files
        run: |
          rm -f tools/patch-hidden-app-list.py
          rm -f tools/fix-hidden-app-list.py
          rm -f .github/workflows/apply-hidden-app-list.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Replace app Hook picker with hidden app list"
          git push
