name: Apply Adaptive Chooser Hook

on:
  push:
    branches: [main]
    paths:
      - tools/patch-adaptive-chooser.py
      - .github/workflows/apply-adaptive-chooser.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/patch-adaptive-chooser.py
      - name: Remove temporary patch files
        run: rm tools/patch-adaptive-chooser.py .github/workflows/apply-adaptive-chooser.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add adaptive chooser second-stage Hook"
          git push
