name: Publish Telegram Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Source release tag (for example v1.6.8); empty means latest'
        required: false
        type: string
  workflow_run:
    workflows:
      - Complete Release Changelog
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - '.github/telegram-republish'

permissions:
  contents: write

concurrency:
  group: telegram-release-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'yagay/ListCleaner' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Check Telegram credential
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo '::error::Add TELEGRAM_BOT_TOKEN to this repository Actions secrets. The bot must be an administrator of @LISTCLEANER with permission to post and delete messages.'
            exit 1
          fi

      - name: Resolve source tag
        id: source
        env:
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [ -f .github/telegram-republish ]; then
            candidate="$(tr -d '[:space:]' < .github/telegram-republish)"
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              tag="$candidate"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish Release APK to Telegram channel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@LISTCLEANER'
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
        run: python3 tools/publish-telegram.py
