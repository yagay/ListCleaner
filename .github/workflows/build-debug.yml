name: Build Debug APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/check-source-localization.py'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build-debug.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'tools/check-source-localization.py'
      - '.github/workflows/build-debug.yml'

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check source localization
        run: python3 tools/check-source-localization.py

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install project SDK
        run: |
          set -o pipefail
          sdkmanager "cmdline-tools;23.0" 2>&1 | tee sdk-tools.log
          sdk_manager="${ANDROID_HOME}/cmdline-tools/23.0/bin/sdkmanager"
          "$sdk_manager" --list --channel=3 > sdk-packages.log 2>&1
          "$sdk_manager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" 2>&1 | tee sdk-install.log
          # Verify installed files instead of parsing version-dependent CLI tables.
          test -s "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/aapt2"

      - name: Build Debug APK
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee debug-build.log

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ListCleaner-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest 2>&1 | tee unit-test.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-build-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            sdk-tools.log
            sdk-packages.log
            sdk-install.log
            debug-build.log
            unit-test.log
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
