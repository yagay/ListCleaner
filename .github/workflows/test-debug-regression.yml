name: Debug Regression Tests (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "cmdline-tools;23.0"
          "${ANDROID_HOME}/cmdline-tools/23.0/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Run Debug unit regression suite
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --build-cache --console=plain :app:testDebugUnitTest 2>&1 | tee regression.log
      - name: Upload failed regression diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debug-regression-failure
          path: |
            regression.log
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
