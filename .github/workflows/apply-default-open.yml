name: Apply Default Open Page

on:
  push:
    paths:
      - '.github/workflows/apply-default-open.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply implementation
        run: python3 tools/apply-default-open.py
      - name: Repair repository additions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/yagay/ListCleaner/data/RuleRepository.kt')
          t = p.read_text()
          if 'import com.yagay.ListCleaner.domain.DefaultOpenConfig' not in t:
              t = t.replace('import com.yagay.ListCleaner.domain.TileConfig', 'import com.yagay.ListCleaner.domain.TileConfig\nimport com.yagay.ListCleaner.domain.DefaultOpenConfig\nimport com.yagay.ListCleaner.domain.OpenPreset')
          if 'private val mutableDefaultOpen' not in t:
              marker = '    private val mutableDiagnostic = MutableStateFlow'
              addition = '''    private val mutableDefaultOpen = MutableStateFlow(runCatching {
              json.decodeFromString(DefaultOpenConfig.serializer(), prefs.getString(KEY_DEFAULT_OPEN, null) ?: "{}").validated()
          }.getOrDefault(DefaultOpenConfig()))
          val defaultOpen: StateFlow<DefaultOpenConfig> = mutableDefaultOpen.asStateFlow()
          '''
              if marker not in t:
                  raise SystemExit('mutableDiagnostic marker missing')
              t = t.replace(marker, addition + marker, 1)
          p.write_text(t)
          PY
      - name: Verify implementation
        run: |
          grep -q 'DEFAULT_OPEN("默认"' app/src/main/java/com/yagay/ListCleaner/ui/MainViewModel.kt
          grep -q 'Destination.DEFAULT_OPEN -> DefaultOpenScreen' app/src/main/java/com/yagay/ListCleaner/ui/MainActivity.kt
          grep -q 'DEFAULT_OPEN preset=' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -q 'RuleBackup(version = 6' app/src/main/java/com/yagay/ListCleaner/data/RuleRepository.kt
          grep -q 'private val mutableDefaultOpen' app/src/main/java/com/yagay/ListCleaner/data/RuleRepository.kt
      - name: Build and test
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Remove one-shot files
        run: rm -f .github/workflows/apply-default-open.yml tools/apply-default-open.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add default open preference page'
          git push
