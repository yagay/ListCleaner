name: Apply Default Open Page

on:
  push:
    paths:
      - '.github/workflows/apply-default-open.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply implementation
        run: python3 tools/apply-default-open.py
      - name: Verify implementation
        run: |
          grep -q 'DEFAULT_OPEN("默认"' app/src/main/java/com/yagay/ListCleaner/ui/MainViewModel.kt
          grep -q 'Destination.DEFAULT_OPEN -> DefaultOpenScreen' app/src/main/java/com/yagay/ListCleaner/ui/MainActivity.kt
          grep -q 'DEFAULT_OPEN preset=' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -q 'RuleBackup(version = 6' app/src/main/java/com/yagay/ListCleaner/data/RuleRepository.kt
      - name: Build and test
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Remove one-shot files
        run: rm -f .github/workflows/apply-default-open.yml tools/apply-default-open.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add default open preference page'
          git push
