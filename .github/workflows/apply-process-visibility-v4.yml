name: Apply Process Visibility V4

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-process-visibility-v4.py'
      - '.github/workflows/apply-process-visibility-v4.yml'

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply process-wide virtual package visibility
        run: python3 tools/patch-process-visibility-v4.py

      - name: Verify process-wide mode and old session mode removal
        run: |
          grep -q 'mode=process_wide' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          ! grep -E 'VirtualDisableContext|virtualDisableContext|armVirtualDisable|activeVirtualDisableContext|VIRTUAL_DISABLE_WINDOW_MS|ADAPTIVE_' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt

      - name: Build and test
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-process-visibility-v4-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Remove one-shot patch files
        run: |
          rm -f tools/patch-process-visibility-v4.py
          rm -f .github/workflows/apply-process-visibility-v4.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use process-wide virtual package visibility"
          git push
