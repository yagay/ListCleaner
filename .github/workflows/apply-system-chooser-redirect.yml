name: Apply System Chooser Redirect

on:
  push:
    paths:
      - 'tools/apply_system_chooser_redirect.py'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply patch
        run: python3 tools/apply_system_chooser_redirect.py
      - name: Verify redirect
        run: |
          grep -q 'CHOOSER_SYSTEM_REDIRECT_APPLIED' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -q 'Intent.createChooser' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          ! grep -q 'installAdaptiveGrantBridge()' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
      - name: Build and test
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-system-chooser-redirect-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
      - name: Cleanup one-shot files
        run: rm -f tools/apply_system_chooser_redirect.py .github/workflows/apply-system-chooser-redirect.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redirect learned custom choosers to system chooser'
          git push
