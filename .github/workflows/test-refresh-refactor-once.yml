name: Apply test refresh refactor once

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Skip unless this is the refactor trigger
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event.head_commit.message }}" = "Run one-shot refresh refactor" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply source refactor
        if: steps.gate.outputs.run == 'true'
        run: python3 tools/test_refresh_refactor.py

      - name: Validate Debug build and tests
        if: steps.gate.outputs.run == 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Commit to test
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "ListCleaner CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java app/src/main/res
          git diff --cached --check
          git commit -m "Align priority with rules and stabilize refresh"
          git push origin HEAD:test
