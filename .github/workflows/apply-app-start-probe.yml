name: Apply App Start Probe

on:
  push:
    paths:
      - tools/apply_app_start_probe.py
      - .github/workflows/apply-app-start-probe.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply patch
        run: python3 tools/apply_app_start_probe.py
      - name: Verify probe
        run: |
          grep -q 'APP_START_PROBE_READY' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -q 'Instrumentation' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -q 'CHOOSER_SYSTEM_REDIRECT_DISABLED' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -q 'com.estrongs.android.pop' app/src/main/resources/META-INF/xposed/scope.list
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-app-start-probe-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Cleanup one-shot files
        run: |
          rm -f tools/apply_app_start_probe.py
          rm -f .github/workflows/apply-app-start-probe.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add generic app-side start probe' || exit 0
          git push
