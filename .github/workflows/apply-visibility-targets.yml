name: Apply Visibility Targets
on:
  push:
    branches: [ main ]
    paths:
      - 'tools/patch-visibility-targets.py'
      - '.github/workflows/apply-visibility-targets.yml'
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply separation
        run: python3 tools/patch-visibility-targets.py
      - name: Verify architecture
        run: |
          grep -q 'visibilityHiddenTargets' app/src/main/java/com/yagay/ListCleaner/domain/ModuleConfig.kt
          grep -q 'current.visibilityHiddenTargets' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          ! grep -q 'current.allSelectedPackages) return false' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
      - name: Build and test
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-visibility-targets-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Remove one-shot patch files
        run: rm -f tools/patch-visibility-targets.py .github/workflows/apply-visibility-targets.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Separate visibility callers and hidden targets'
          git push
