name: Apply Adaptive Grant Session

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-adaptive-grant-session.py'
      - '.github/workflows/apply-adaptive-grant-session.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Apply patch
        run: python3 tools/patch-adaptive-grant-session.py
      - name: Verify bridge
        run: |
          grep -q 'CHOOSER_GRANT_BRIDGE_READY' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -q 'requestSystemGrantThenLaunch' app/src/main/java/com/yagay/ListCleaner/ui/AdaptiveChooserActivity.kt
      - name: Build and test
        run: bash ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ListCleaner-adaptive-grant-session-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
      - name: Cleanup one-shot files
        run: rm -f tools/patch-adaptive-grant-session.py .github/workflows/apply-adaptive-grant-session.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Route adaptive chooser URI grants through system server'
          git push
