name: Apply Virtual Disable V2

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-virtual-disable-v2.py'
      - '.github/workflows/apply-virtual-disable-v2.yml'

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply broader virtual disabled view
        run: python3 tools/patch-virtual-disable-v2.py

      - name: Verify obsolete adaptive code stays removed
        run: |
          ! grep -R "ADAPTIVE_\|AdaptiveContext\|adaptiveFilterCollection\|adaptivePackageName" app/src/main/java || exit 1
          test ! -e app/adaptive-chooser-build-marker.txt

      - name: Build and test
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-virtual-disable-v2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Remove one-shot patch files
        run: |
          rm -f tools/patch-virtual-disable-v2.py
          rm -f .github/workflows/apply-virtual-disable-v2.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Expand virtual disabled PackageManager view"
          git push
