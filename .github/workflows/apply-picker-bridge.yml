name: Apply System Picker Bridge

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_picker_bridge.py'
      - '.github/workflows/apply-picker-bridge.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Apply patch
        run: python3 tools/apply_picker_bridge.py

      - name: Verify bridge
        run: |
          grep -Fq 'APP_PICKER_BRIDGE_LAUNCH' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -Fq 'APP_PICKER_BRIDGE_RESULT' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -Fq 'ACTION_PICK_ACTIVITY' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt

      - name: Build and test
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-system-picker-bridge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup one-shot files
        run: |
          rm -f tools/apply_picker_bridge.py
          rm -f .github/workflows/apply-picker-bridge.yml

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add app-process system picker bridge experiment'
          git push
