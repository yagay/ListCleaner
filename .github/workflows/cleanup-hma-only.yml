name: Cleanup HMA Only

on:
  push:
    branches: [main]
    paths:
      - 'tools/cleanup_hma_only.py'
      - '.github/workflows/cleanup-hma-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply cleanup
        run: python3 tools/cleanup_hma_only.py
      - name: Verify HMA-only architecture
        run: |
          grep -q 'AppsFilterImpl' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -q 'SYSTEM_VISIBILITY_FILTER' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          ! grep -q 'Layer.APP\|installApplicationClientHooks\|installVirtualComponentHooks\|PROCESS_VISIBILITY_\|VIRTUAL_.*HOOK_ID' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
      - name: Build and test
        run: bash ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-hma-only-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Remove one-shot files
        run: rm -f tools/cleanup_hma_only.py .github/workflows/cleanup-hma-only.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove obsolete app visibility hooks' || exit 0
          git push
