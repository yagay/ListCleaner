name: Apply Strict App Hook Layer

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-app-layer.py'
      - '.github/workflows/apply-strict-app-layer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 tools/patch-app-layer.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Tighten third-party app Hook filtering'
          git push
