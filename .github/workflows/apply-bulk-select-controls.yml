name: Apply Bulk Select Controls

on:
  push:
    paths:
      - 'tools/apply_bulk_select_controls.py'
      - '.github/workflows/apply-bulk-select-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply patch
        run: python3 tools/apply_bulk_select_controls.py
      - name: Verify controls
        run: |
          grep -Fq 'Text("全选")' app/src/main/java/com/yagay/ListCleaner/ui/MainControls.kt
          grep -Fq 'Text("反选")' app/src/main/java/com/yagay/ListCleaner/ui/MainControls.kt
          grep -Fq 'fun invertComponents' app/src/main/java/com/yagay/ListCleaner/ui/MainViewModel.kt
          grep -Fq 'selectPriorityApps' app/src/main/java/com/yagay/ListCleaner/ui/PriorityDialog.kt
          grep -Fq 'vm.invertComponents(visible)' app/src/main/java/com/yagay/ListCleaner/ui/RootComponentsScreen.kt
      - name: Build and test
        run: bash ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-bulk-select-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Remove one-shot files
        run: rm -f tools/apply_bulk_select_controls.py .github/workflows/apply-bulk-select-controls.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add bulk select and invert controls'
          git push origin HEAD:main
