name: Prepare Release 1.6.6

on:
  push:
    paths:
      - '.github/workflows/prepare-release-1.6.6.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update version and release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('versionCode = 30', 'versionCode = 31', 1)
          text = text.replace('versionName = "1.6.5"', 'versionName = "1.6.6"', 1)
          gradle.write_text(text)

          Path('RELEASE_NOTES.md').write_text('''列表清理 / List Cleaner 1.6.6

- 加强 Android 12–17 的系统级应用可见性兼容，应用隐藏列表继续通过 system/system_server 生效。
- 应用隐藏列表显示完整已安装应用，并加入应用图标，便于选择来源应用。
- 规则页和排序页新增“自定义显示名称”，可按 Intent 分类修改分享、打开方式、浏览器、文本处理等候选项在系统菜单中的显示文字；不修改实际 Intent、包名、组件名或跳转目标。
- 自定义显示名称与清理规则、优先排序相互独立；留空可恢复原名称，“全部显示”模式下暂停应用自定义名称。
- 规则、排序和组件页补充全选/反选操作；组件页移除多余的手动刷新按钮。
- 保留既有规则、排序、应用隐藏列表和备份兼容行为，并补充相关校验与回归测试。

旧 Debug 版签名可能不同；安装前请导出规则备份。
''', encoding='utf-8')
          PY

      - name: Verify release metadata
        run: |
          grep -q 'versionCode = 31' app/build.gradle.kts
          grep -q 'versionName = "1.6.6"' app/build.gradle.kts
          head -n1 RELEASE_NOTES.md | grep -Fx '列表清理 / List Cleaner 1.6.6'

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/prepare-release-1.6.6.yml

      - name: Commit release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare List Cleaner 1.6.6 release'
          git push
