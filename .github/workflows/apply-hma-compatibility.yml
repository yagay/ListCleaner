name: Apply HMA Compatibility Hardening

on:
  push:
    paths:
      - 'tools/apply_hma_compatibility.py'
      - '.github/workflows/apply-hma-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply patch
        run: python3 tools/apply_hma_compatibility.py
      - name: Verify HMA hardening
        run: |
          grep -Fq 'com.android.server.pm.AppsFilter"' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -Fq 'VisibilitySignature.parse' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -Fq 'android.permission.QUERY_ALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -Fq 'fun invertSelected' app/src/main/java/com/yagay/ListCleaner/data/RuleRepository.kt
          ! grep -Fq 'packageFallback = false' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
      - name: Build and test
        run: bash ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-hma-compat-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Remove one-shot files
        run: rm -f tools/apply_hma_compatibility.py .github/workflows/apply-hma-compatibility.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden HMA package visibility compatibility'
          git push origin HEAD:main
