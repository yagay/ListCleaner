name: Apply Menu Model Parser Fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-menu-model-parser-fix.py'
      - '.github/workflows/apply-menu-model-parser-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply patch
        run: python3 tools/apply-menu-model-parser-fix.py
      - name: Verify parser fix
        run: |
          grep -Fq 'APP_MENU_MODEL_PARSE' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -Fq 'looksLikeStrictPackage' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
          grep -Fq 'looksLikeActivityClass' app/src/main/java/com/yagay/ListCleaner/xposed/ListCleanerModule.kt
      - name: Build and test
        run: |
          bash ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ListCleaner-menu-model-parser-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup one-shot files
        run: rm -f tools/apply-menu-model-parser-fix.py .github/workflows/apply-menu-model-parser-fix.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix generic chooser menu model parsing'
          git push
