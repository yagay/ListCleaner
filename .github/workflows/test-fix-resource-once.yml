name: Fix test resource once

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix observed help resource'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0
      - name: Fix resource
        run: sed -i "s/target app's share panel/target app share panel/" app/src/main/res/values/strings_ui.xml
      - name: Commit
        run: |
          git config user.name "ListCleaner CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/res/values/strings_ui.xml
          git commit -m "Fix observed entry help resource"
          git push origin HEAD:test
